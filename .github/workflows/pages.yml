name: Refresh prediction and deploy site

on:
  schedule:
    - cron: "0 14 * * *"   # 10am ET daily — after dmbalmanac posts setlists
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Incremental scrape (new setlists only)
        run: python3 scraper.py --incremental

      - name: Predict next show
        id: predict
        # Exit 3 = no upcoming show anywhere (offseason) — skip the site
        # rebuild but still commit fresh show data; anything else is a
        # real failure.
        run: |
          set +e
          python3 predict.py --target-date auto
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "has_pred=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          else
            echo "has_pred=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site + sheet image
        if: steps.predict.outputs.has_pred == 'true'
        run: |
          python3 build_site.py
          python3 make_sheet_image.py

      # Only shows.json is committed back (scrape state). Generated files
      # (prediction.json, site/) deploy via the Pages artifact and stay out
      # of git so daily runs never conflict with local work.
      - name: Commit updated show data back to main
        run: |
          git config user.name "setlist-bot"
          git config user.email "actions@github.com"
          git add data/shows.json
          git diff --cached --quiet || git commit -m "Show data: $(date -u +%F)"
          git pull --rebase --autostash origin main
          git push

      - uses: actions/upload-pages-artifact@v3
        if: steps.predict.outputs.has_pred == 'true'
        with:
          path: site/

      - uses: actions/deploy-pages@v4
        if: steps.predict.outputs.has_pred == 'true'
